name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "15-ci-pipeline-build-and-test-on-every-push" ] # was main originally
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest # runner
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      # Set up dotnet SDK version for reproducibility
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Build
      - name: Build
        run: dotnet build ConnectFour.slnx
      # Test
      - name: Test
        run: dotnet test ConnectFour.slnx

  frontend:
    name: Frontend (node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ConnectFour.Web
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/ConnectFour.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      # Tests - none atm so comment out
      #- name: Test
        #run: npm test


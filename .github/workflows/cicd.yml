name: CI/CD

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest # runner
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      # Set up dotnet SDK version for reproducibility
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Build
      - name: Build
        run: dotnet build ConnectFour.slnx
      # Test
      - name: Test
        run: dotnet test ConnectFour.slnx

  frontend:
    name: Frontend (node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ConnectFour.Web
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/ConnectFour.Web/package-lock.json
      # Install
      - name: Install
        run: npm ci
      # Build
      - name: Build
        run: npm run build
      # Tests - none atm so comment out
      #- name: Test
        #run: npm test

  deploy:
      name: Deploy to AWS App Runner
      needs: [ backend, frontend ]
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        id-token: write        # required for OIDC
        contents: read
      env:
        AWS_REGION: eu-west-2
        ECR_REPOSITORY: connectfour
      steps:
        - uses: actions/checkout@v6

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }} # stored in repository variables
            aws-region: ${{ env.AWS_REGION }}

        - name: Log in to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag, and push image
          env:
            REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build \
              -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
              -t "$REGISTRY/$ECR_REPOSITORY:latest" .
            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker push "$REGISTRY/$ECR_REPOSITORY:latest"
